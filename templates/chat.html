<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>HeartTells - Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/chat.css">
</head>
<body data-mood="neutral">
    <div class="ambient" aria-hidden="true">
        <span class="orb orb-1"></span>
        <span class="orb orb-2"></span>
        <span class="orb orb-3"></span>
    </div>

    <div class="chat-shell">
        <header class="chat-header">
            <div class="presence">
                <div class="heart-wrap" aria-hidden="true">
                    <span class="heart-ripple"></span>
                    <svg class="heart" viewBox="0 0 24 24" width="28" height="28">
                        <path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 4.5 6.7 4.5c2.1 0 3.6 1.2 4.3 2.5h2c.7-1.3 2.2-2.5 4.3-2.5 3.7 0 5.8 3.9 4.3 7.3C19.5 16.4 12 21 12 21z"/>
                    </svg>
                </div>
                <div class="presence-text">
                    <h1>HeartTells</h1>
                    <p id="status-line" class="status-line" aria-live="polite">
                        <span class="status-dot"></span><span id="status-text">Here with you</span>
                    </p>
                </div>
            </div>
            <div class="vitals" title="Your heart rhythm, as HeartTells feels it">
                <canvas id="ecg-trace" class="ecg-trace" width="160" height="40" aria-hidden="true"></canvas>
                <div class="bpm"><span id="bpm-value">72</span><small>bpm</small></div>
            </div>
            <button id="clear-btn" class="icon-btn" title="Start a new conversation" aria-label="Start a new conversation">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M4 4v6h6M20 20v-6h-6M5 15a8 8 0 0 0 14 2M19 9A8 8 0 0 0 5 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </header>

        <main id="messages" class="messages" aria-live="polite" aria-label="Conversation"></main>

        <div id="suggestions" class="suggestions" aria-label="Suggested replies"></div>

        <form id="composer" class="composer" autocomplete="off">
            <textarea id="input" rows="1" placeholder="What's on your heart?" aria-label="Message" maxlength="4000"></textarea>
            <button id="send-btn" type="submit" class="send-btn" aria-label="Send" disabled>
                <svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 12l16-8-6 16-2.5-6.5L4 12z" fill="currentColor"/></svg>
            </button>
        </form>
    </div>

    <script src="/static/js/chat.js"></script>
</body>
</html>
